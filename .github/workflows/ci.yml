# Build, lint and run the self tests on every push.
#
# Only the deterministic suites run here: --selftest, --sourcetest and
# --deploytest. --downloadtest and --canceltest talk to GitHub, so they are not
# part of CI; run them by hand when the download path changes.
#
# The test binaries now report failures through their exit code, so a red check
# means exactly "a [FAIL] line was printed".
name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      # 内置资产（apps/electron/bundled-*）按发布规则不进代码镜像，所以这里没有它们：
      # 跳过几个"需要内置资产真在磁盘上"的测试，其余照跑。本地开发时这些测试仍会跑
      # （资产就在工作区里），所以"改名忘了同步清单"这类错依然会在本地被抓住。
      - name: tests（core 的无界面自测：sourcetest / selftest / deploytest）
        run: cargo test -- --skip bundled_ --skip dlss5_assets_report

      # The shipped UI is the Electron app in apps/electron (plain HTML/CSS/JS, no
      # build step) plus the Rust sidecar in apps/sidecar. The sidecar has its own
      # workspace, so it gets its own check - otherwise a change to crates/core
      # could break it without CI noticing. The retired Tauri app (apps/desktop)
      # has been deleted.
      - name: clippy + build the sidecar
        working-directory: apps/sidecar
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo build --release

